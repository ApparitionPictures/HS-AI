# =====================================================================
#  HS-AI default configuration.  Do NOT edit this file: put your own
#  changes in configs/user.yaml (same layout, only the keys you change).
#  Every key is documented in hsai/config.py.
# =====================================================================
seed: 1

game:
  window_title_contains: "Half Sword"
  process_name: "HalfSwordUE5-Win64-Shipping.exe"
  steam_app_id: 2397300
  install_dir: ""            # leave empty: found automatically from Steam
  time_dilation: 1.0         # 1.0 = real time.  0.5 = half speed (easier early curriculum)
  target_fps: 60             # agent decision rate; the game must render at least this fast

capture:
  backend: auto              # auto | bettercam | dxcam | mss
  monitor_index: 0
  region: null               # normalized [l, t, r, b] of the monitor; null = whole monitor
  target_fps: 60
  gpu_upload: true

obs:
  size: 96
  stack: 4
  gray: true
  crop: [0.10, 0.05, 0.90, 0.95]
  max_enemies: 2
  bones: [head, hand_r, hand_l, pelvis]
  include_prev_action: true

telemetry:
  transport: pipe            # pipe (lowest latency) | file
  pipe_name: '\\.\pipe\hsai_telemetry'
  file_path: "%LOCALAPPDATA%/HSAI/telemetry.txt"
  cmd_path: "%LOCALAPPDATA%/HSAI/cmd.txt"
  stale_ms: 250

input:
  keys:                      # match these to the game's Options > Controls
    forward: W
    back: S
    left: A
    right: D
    sprint: SHIFT
    crouch: CTRL
    kick: SPACE
    thrust: ALT
    lock_on: TAB
    interact: E
    swap: X
    surrender: G
  mouse_max_speed_px_s: 3000.0
  mouse_subticks: 4
  mouse_smoothing: 0.35
  kill_switch_key: F12       # press at any time: releases all keys and stops the agent
  pause_key: F11             # toggles pause
  require_foreground: true

actions:
  move: true
  lmb: true
  rmb: true
  thrust: true
  sprint: true
  kick: true
  crouch: true
  surrender: false

reward:
  damage_dealt: 0.04
  ko_dealt: 0.02
  damage_taken: 0.05
  ko_taken: 0.02
  time_penalty: 0.0005
  low_stamina_penalty: 0.0005
  low_stamina_frac: 0.15
  approach_potential: 0.02
  engage_distance_m: 2.0
  kite_penalty: 0.002
  kite_grace_s: 4.0
  kite_far_m: 3.5
  win: 10.0
  win_health_bonus: 6.0
  lose: -10.0
  timeout: -3.0
  surrender: -6.0
  clip_step: 3.0

episode:
  max_seconds: 120.0
  start_grace_s: 1.0
  ko_grace_s: 3.0
  enemy_dead_confirm_s: 1.0
  reset_mode: macro          # macro = replay your recorded "after_fight" macro; mod = heal/respawn via the mod
  macro_after_fight: after_fight
  lock_on_at_start: true
  post_terminal_wait_s: 2.5
  fight_start_timeout_s: 90.0
  auto_surrender_after_s: 20.0
  hopeless_health: 5.0
  mod_reset_spawn_distance_m: 3.0
  mod_reset_enemy_class: ""

model:
  conv_channels: [32, 64, 64]
  conv_out: 256
  state_hidden: 128
  gru_hidden: 512
  logstd_init: -0.5
  logstd_min: -3.0
  logstd_max: 0.5
  backend: auto              # auto | tensorrt | cuda_graph | eager
  precision: fp16
  trt_workspace_mb: 1024

ppo:
  gamma: 0.997
  lam: 0.95
  clip: 0.2
  value_clip: 0.2
  value_coef: 0.5
  entropy_discrete: 0.004
  entropy_continuous: 0.0015
  lr: 3.0e-4
  lr_min: 5.0e-5
  lr_decay_updates: 4000
  epochs: 3
  minibatches: 4
  seq_len: 32
  rollout_steps: 1024
  max_grad_norm: 0.5
  target_kl: 0.03
  adv_norm: true
  value_norm: true
  reward_norm: true
  weight_decay: 0.0
  bc_kl_coef: 0.0
  bc_kl_decay_updates: 500
  amp: bf16

explore:
  noise: pink
  beta: 1.0
  scale: 1.0
  eval_every_episodes: 10

generations:
  episodes_per_generation: 20
  min_episodes_for_elite: 10
  patience: 2
  margin: 0.05
  keep_top_k: 5
  lr_factors: [0.7, 1.4]
  entropy_factors: [0.7, 1.4]
  beta_delta: 0.25
  fitness_win: 2.0
  fitness_clean: 1.0
  fitness_dealt: 1.0
  fitness_taken: 1.0

learner:
  device: cuda
  minibatch_sleep_ms: 0
  weight_sync_every_updates: 1
  compile: false
  channels_last: true
  cudnn_benchmark: true
  max_spool_backlog: 6

paths:
  runs_dir: runs
  spool_dir: spool
  checkpoints_dir: checkpoints
  macros_dir: macros
  recordings_dir: recordings

record:
  chunk_steps: 1800
  keep_full_frames: false
